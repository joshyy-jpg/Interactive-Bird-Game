<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild / Wings</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas#scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      video#webcam {
        display: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      #overlay .panel {
        pointer-events: auto;
      }
      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 20px;
        max-width: 480px;
        line-height: 1.5;
      }
      #calibration-bar-track {
        margin: 16px auto 0;
        width: 240px;
        height: 10px;
        border: 1px solid #fff;
        border-radius: 6px;
        overflow: hidden;
      }
      #calibration-bar-fill {
        height: 100%;
        width: 0%;
        background: #4ade80;
        transition: width 0.1s linear;
      }
      #instructions {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-size: 14px;
        opacity: 0.85;
      }
      #debug {
        position: absolute;
        top: 8px;
        left: 8px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        white-space: pre;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 8px;
        border-radius: 4px;
      }
      #error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        max-width: 480px;
        font-size: 16px;
        color: #fca5a5;
        display: none;
      }
      #preview-wrap {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 200px;
        display: none;
      }
      #preview-wrap.visible {
        display: block;
      }
      #preview {
        display: block;
        width: 100%;
        height: auto;
        border: 2px solid rgba(255, 255, 255, 0.7);
        border-radius: 6px;
        background: #111;
      }
      #preview-label {
        margin-top: 4px;
        font-size: 11px;
        text-align: center;
        opacity: 0.8;
      }
      #mode-select,
      #course-result {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
        background: rgba(0, 0, 0, 0.55);
        padding: 28px 36px;
        border-radius: 12px;
      }
      #timer {
        position: absolute;
        top: 8px;
        right: 8px;
        display: none;
        font-size: 20px;
        font-family: ui-monospace, monospace;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 12px;
        border-radius: 4px;
      }
      #course-result-time {
        font-size: 28px;
        margin: 6px 0;
      }
      #course-result-best {
        font-size: 14px;
        opacity: 0.85;
        margin-bottom: 18px;
      }
    </style>
    <link rel="stylesheet" href="/src/menu.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <video id="webcam" autoplay playsinline muted></video>
      <div id="overlay">
        <div id="message" class="panel">
          Loading pose tracker&hellip;
          <div id="calibration-bar-track"><div id="calibration-bar-fill"></div></div>
        </div>
        <div id="instructions" class="panel"></div>
        <div id="debug" class="panel"></div>
        <div id="mode-name" hidden>Free roam</div>
        <div id="petal-counter" hidden><span id="petal-count">00/08</span><span id="petal-label">Sky petals</span></div>
        <div id="petal-marker" hidden aria-hidden="true"><i class="petal-pointer"></i><span id="petal-distance"></span></div>
        <div id="petal-toast" role="status"></div>
        <div id="speed-hud" hidden>
          <div class="speed-line"><span id="speed-value">16</span><span class="speed-unit">m/s</span></div>
          <div id="flight-status">Gliding</div>
          <div class="stamina-row">
            <span id="flap-status">Stamina 100%</span>
            <div class="stamina-track" role="progressbar" aria-label="Flap stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="stamina-fill"></div></div>
          </div>
        </div>
        <div id="tracking-status" hidden>
          <svg viewBox="0 0 22 18" aria-hidden="true"><path d="M2 9l6 6L20 3"/></svg>
          <span id="tracking-text">Camera tracking</span>
        </div>
        <div id="setup-title">Camera setup</div>
        <button id="setup-back" class="panel cut-button outline">Back</button>
        <div id="error" class="panel"></div>
        <div id="preview-wrap" class="panel">
          <canvas id="preview" width="640" height="480"></canvas>
          <div id="preview-label">Camera &amp; tracking</div>
        </div>
        <div id="mode-select" class="panel">
          <aside class="menu-panel">
            <div class="brand">WILD / WINGS</div>
            <div class="brand-rule"></div>
            <div class="section-label">Bird</div>
            <div class="bird-options">
              <button class="bird-option" data-bird="dove" aria-pressed="true">White dove</button>
              <button class="bird-option" data-bird="eagle" aria-pressed="false">Bald eagle</button>
              <button class="bird-option" data-bird="pigeon" aria-pressed="false">Pigeon</button>
              <button class="bird-option" data-bird="gull" aria-pressed="false">Seagull</button>
            </div>
            <hr class="menu-divider" />
            <div class="section-label" id="controls-heading">Controls</div>
            <div class="segmented" role="group" aria-labelledby="controls-heading">
              <button class="cut-button outline" data-control="motion" aria-pressed="true">Camera</button>
              <button class="cut-button outline" data-control="keyboard" aria-pressed="false">Keyboard</button>
            </div>
            <hr class="menu-divider" />
            <div class="section-label" id="mode-heading">Mode</div>
            <div class="segmented" role="group" aria-labelledby="mode-heading">
              <button id="mode-select-free-roam" class="cut-button outline" data-mode="freeRoam" aria-pressed="true">Free roam</button>
              <button id="mode-select-time-trial" class="cut-button outline" data-mode="timeTrial" aria-pressed="false">Time trial</button>
            </div>
            <hr class="menu-divider" />
            <button id="start-flight" class="cut-button solid menu-cta">Camera setup</button>
            <p id="start-hint">Check your position before flying.</p>
          </aside>
          <div class="preview-caption" id="bird-name">White dove</div>
        </div>
        <button id="pause-button" class="panel cut-button" hidden>Pause [Esc]</button>
        <div id="pause-menu" class="panel" role="dialog" aria-labelledby="pause-title">
          <h2 id="pause-title">Rest your wings</h2>
          <div class="pause-actions">
            <button id="pause-resume" class="cut-button solid">Resume flight</button>
            <button id="pause-back" class="cut-button outline">Back to nest</button>
          </div>
          <div class="section-label">Controls</div>
          <ul id="pause-controls"></ul>
        </div>
        <div id="timer" class="panel"></div>
        <div id="course-result" class="panel">
          <h2 id="course-result-heading">Finished!</h2>
          <div id="course-result-time"></div>
          <div id="course-result-best"></div>
          <div class="result-actions">
            <button id="course-result-fly-again" class="cut-button solid">Fly again</button>
            <button id="course-result-change-mode" class="cut-button outline">Change mode</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
